# Nginx INTERNO do NERV AI — origem unica: / vai para o Next, /api/ vai para o
# FastAPI. Servir tudo do mesmo host evita CORS e simplifica o certificado.
#
# ISOLAMENTO: este nginx NAO escuta em 80/443 do host. Ele fica atras do proxy
# que ja existe na VPS (o mesmo que serve os outros projetos), acessivel apenas
# em 127.0.0.1:${NERV_HTTP_PORT}. O TLS termina la fora, nao aqui.

# Preserva o protocolo original: quem termina TLS e' o proxy de fora, entao
# sobrescrever com $scheme faria o app achar que a request veio em http.
map $http_x_forwarded_proto $nerv_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $nerv_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nerv_backend  { server backend:8000; }
upstream nerv_frontend { server frontend:3000; }

server {
    listen 80;
    server_name _;

    # Foto de celular estoura os 4,5 MB que a Vercel impunha. Aqui nao ha teto.
    # ATENCAO: o proxy de fora tambem precisa de client_max_body_size, senao ele
    # corta antes de chegar aqui.
    client_max_body_size 25m;

    location /api/ {
        # A barra final e' o que remove o prefixo /api antes de chegar no FastAPI.
        proxy_pass http://nerv_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nerv_forwarded_proto;
        proxy_set_header Connection        "";

        # Streaming SSE do tutor: com buffer, o chat parece travado ate o fim.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://nerv_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nerv_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $nerv_connection_upgrade;
    }
}
