# Stack de DESENVOLVIMENTO. Para producao na VPS use docker-compose.prod.yml.
name: nerv-ai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nerv
      POSTGRES_PASSWORD: nerv
      POSTGRES_DB: nerv_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerv -d nerv_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      # Contexto e' a RAIZ do repo: o Dockerfile.backend faz `COPY backend/...`.
      context: ..
      dockerfile: infra/Dockerfile.backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://nerv:nerv@db:5432/nerv_ai
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
      args:
        # Build time: o Next inlineia isto no bundle do navegador.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DEMO_MODE: "false"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
