# Deploy do backend no Railway (Fase 1, seção 10)

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/Dockerfile.backend"

[deploy]
# Migrations antes de servir: com APP_ENV=production o lifespan nao cria tabelas,
# entao sem o upgrade o banco sobe vazio e todo request quebra.
startCommand = "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
